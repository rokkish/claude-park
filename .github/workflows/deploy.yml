name: Deploy to GitHub Pages

# docs/ フォルダや gh-pages ブランチは使わない。
# このリポジトリの docs/ には仕様書が入っているため、Pages のソースに
# するとそちらが公開されてしまう。Actions から dist/ を直接配信する。
#
# サードパーティ Action は全て full commit SHA で pin する。
# @v4 のような可変タグは、上流でタグが付け替えられると別のコードが
# 黙って実行される（tj-actions/changed-files の事例と同種のサプライ
# チェーン攻撃）。この workflow は pages: write と id-token: write を
# 持つため、乗っ取られると公開サイトを差し替えられる。
# 更新時は SHA とコメントのバージョンを必ず両方直すこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push 時は最新のデプロイだけを残す。実行中のものは中断しない
# （中断すると Pages が中途半端な状態で残ることがあるため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # テストと型検査を公開前のゲートにする。
      # ステージ1が「単独では不可能・2人なら可能」であることの検算も
      # ここに含まれているので、壊れたまま公開されることはない。
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
