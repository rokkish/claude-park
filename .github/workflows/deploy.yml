name: Deploy to GitHub Pages

# docs/ フォルダや gh-pages ブランチは使わない。
# このリポジトリの docs/ には仕様書が入っているため、Pages のソースに
# するとそちらが公開されてしまう。Actions から dist/ を直接配信する。
#
# サードパーティ Action は全て full commit SHA で pin する。
# @v4 のような可変タグは、上流でタグが付け替えられると別のコードが
# 黙って実行される（tj-actions/changed-files の事例と同種のサプライ
# チェーン攻撃）。この workflow は pages: write と id-token: write を
# 持つため、乗っ取られると公開サイトを差し替えられる。
# 更新時は SHA とコメントのバージョンを必ず両方直すこと。
#
# 入れ子にも注意。upload-pages-artifact は v3 系だと内部で
# actions/upload-artifact@v4 を可変タグのまま呼んでおり、
# リポジトリの「全 Action を SHA で pin」ポリシーに弾かれる。
# 内部を pin している v4 以降を使う必要がある。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push 時は最新のデプロイだけを残す。実行中のものは中断しない
# （中断すると Pages が中途半端な状態で残ることがあるため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # テストと型検査を公開前のゲートにする。
      # ステージ1が「単独では不可能・2人なら可能」であることの検算も
      # ここに含まれているので、壊れたまま公開されることはない。
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
