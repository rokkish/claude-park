<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Park</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #131110;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      /* 論理解像度 960x432 を維持したまま viewport に収める */
      #game {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 960 / 432;
        width: 960px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
