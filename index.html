<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no: ダブルタップズームが入ると連打がズーム扱いになり操作不能になる -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Claude Park</title>

    <!-- iPhone の Safari は Fullscreen API に対応していないため、URL バーを
         消すには「ホーム画面に追加」で PWA として起動してもらう必要がある。
         manifest と apple- 系メタの両方が要る。 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#131110" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude Park" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <style>
      :root {
        --bg: #131110;
        --btn: #2e2a26;
        --btn-edge: #3d3833;
        --text: #f0e5d8;
        --dim: #8a8078;
        --p1: #d97757;
        --p2: #57a8d9;

        /* タップ標的。44px は最低ライン、アクション操作には 70px 前後が要る。
           上下限を px で挟み、タブレットで巨大化・小型機で潰れるのを防ぐ。 */
        --btn-size: clamp(56px, 19vmin, 92px);
        --jump-size: calc(var(--btn-size) * 1.15);
        /* 操作帯の高さ。canvas の大きさをここから逆算するので、
           内容依存にせず必ず確定値にしておく。 */
        --bar-h: calc(var(--jump-size) + 24px);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        /* 引っ張って更新やバウンススクロールが操作を奪うのを防ぐ */
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      #stage-area {
        position: relative;
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* 全ステージ踏破中だけ出す。クリア演出は canvas に描かれるが、
         リンクを開く必要があるのでこれだけは DOM に置く。 */
      #share-button {
        display: none;
      }

      body.all-cleared #share-button {
        position: absolute;
        left: 50%;
        bottom: 6%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border: 2px solid var(--p1);
        border-radius: 999px;
        background: var(--btn);
        color: var(--text);
        font: 600 15px/1 system-ui, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      body.all-cleared #share-button:hover,
      body.all-cleared #share-button:focus-visible {
        background: var(--p1);
        color: #1b1917;
      }

      #share-button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /*
       * 幅を viewport から直接計算し、高さは aspect-ratio に決めさせる。
       *
       * width:100% / height:100% + object-fit には頼れない。親の高さが
       * 内容依存だとパーセントが解決されず、canvas が固有サイズ
       * （バッキングストアの 960*dpr = dpr3 なら 2880px）で表示されて
       * 画面からはみ出す。実際にそれで下部が操作帯に隠れた。
       * 20/9 は 960/432。
       */
      #game {
        display: block;
        aspect-ratio: 960 / 432;
        width: min(960px, 100vw, calc(100dvh * 20 / 9));
        background: var(--bg);
      }

      /* 操作帯のぶんを引いた高さに収める。 */
      body.touch-mode #game {
        width: min(100vw, calc((100dvh - var(--bar-h)) * 20 / 9));
      }

      /* ===== タッチ操作 ===== */

      #touch-controls,
      #sys-buttons {
        display: none;
      }

      body.touch-mode #touch-controls {
        display: flex;
        /* canvas の幅を --bar-h から逆算しているので、実際の高さも
           必ずそれに一致させる。内容で伸び縮みさせると計算がずれる。 */
        height: var(--bar-h);
        box-sizing: border-box;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        /* 中央を大きく空ける。2人が1台を挟むので手がぶつかると操作を邪魔する。 */
        gap: 8vw;
        padding: 8px max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        /* ボタン上でのスクロール・ズーム・長押しメニューを全て殺す */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      .pad {
        display: flex;
        align-items: center;
        /* 詰めすぎると誤爆、離しすぎると同時押しが遠い。指1本ぶんの隙間。 */
        gap: 10px;
      }

      [data-btn] {
        appearance: none;
        border: 2px solid var(--btn-edge);
        background: var(--btn);
        color: var(--text);
        font: 600 clamp(18px, 5vmin, 30px) / 1 system-ui, sans-serif;
        display: grid;
        place-items: center;
        touch-action: none;
        /* pointer-events は既定のまま。elementFromPoint がこの要素を返す必要がある。 */
      }

      /*
       * 並びは 左 / ジャンプ / 右。
       * ジャンプを端に置くと「左+ジャンプ」が両端に離れて同時押しが遠くなる。
       * 中央に置けば左右どちらとの組み合わせも隣接した2つで済み、距離が揃う。
       * 2人で1台を共有する都合上、各自が使えるのは片手の指2本程度なので
       * 移動距離がそのまま押しやすさになる。
       *
       * 引き換えに、左右を隣接させて指を離さず切り替えるロッカーは使えない。
       * 実機で同時押しのしづらさの方が問題だったため、そちらを優先した。
       */
      .pad [data-btn] {
        width: var(--btn-size);
        height: var(--btn-size);
        border-radius: 14px;
      }

      /* ジャンプはタイミングが要求されるので一回り大きく、指が迷わない円形に。 */
      .pad .jump {
        width: var(--jump-size);
        height: var(--jump-size);
        border-radius: 50%;
      }

      /* 操作とキャラの対応を色で直結させる。ラベルより速く読める。 */
      .pad-p1 [data-btn] {
        border-color: var(--p1);
      }

      .pad-p2 [data-btn] {
        border-color: var(--p2);
      }

      .pad-p1 [data-btn].is-pressed {
        background: var(--p1);
        color: #1b1917;
      }

      .pad-p2 [data-btn].is-pressed {
        background: var(--p2);
        color: #1b1917;
      }

      /* START / R はプレイ中に触らないものなので、親指の可動域から外して
         画面上部へ逃がす。誤爆すると進行が巻き戻る。 */
      body.touch-mode #sys-buttons {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
        touch-action: none;
      }

      #sys-buttons [data-btn] {
        min-width: 60px;
        height: 40px;
        padding: 0 12px;
        font-size: 14px;
        border-radius: 10px;
        opacity: 0.8;
      }

      #sys-buttons [data-btn].is-pressed {
        background: var(--text);
        color: #1b1917;
      }

      /* 外部リンク。左上に置く。canvas とは別レイヤなので、
         横画面では canvas 左脇の余白に収まり、絵を隠さない。 */
      #links {
        position: fixed;
        z-index: 20;
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        display: flex;
        gap: 8px;
      }

      #links a {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 1px solid var(--btn-edge);
        border-radius: 10px;
        background: rgba(46, 42, 38, 0.72);
        color: var(--dim);
        opacity: 0.8;
        transition:
          color 0.15s,
          opacity 0.15s;
        -webkit-tap-highlight-color: transparent;
      }

      #links a:hover,
      #links a:focus-visible {
        color: var(--text);
        opacity: 1;
      }

      /* タッチでは 44px 未満は押しにくい。 */
      body.touch-mode #links a {
        width: 44px;
        height: 44px;
      }

      #links svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      /* 横画面は縦の余裕が無いので、操作帯を必要最小限の高さに抑える。 */
      @media (orientation: landscape) {
        :root {
          --btn-size: clamp(52px, 17vmin, 84px);
        }

        body.touch-mode #touch-controls {
          gap: 4vw;
        }
      }

      /*
       * 縦画面では操作帯が入り切らない（幅390pxの端末で必要幅は約554px）。
       * 2行に折り返しても、ステージが 20:9 と横長なのでゲーム画面は
       * 390x175 まで縮み、実際のプレイ領域は約50pxしか残らない。
       * 遊べない状態を出すより、横向きを促す方が正直。
       *
       * ただし幅が足りるなら縦でも遊べる。必要幅は概ね
       *   (ボタン径x2 + ジャンプ径 + 隙間x2) x 2人 + 8vw + 28
       * で、ボタン径が上限 92px に張り付く大画面では約 704px が分岐点。
       * しきい値はそこに余裕を見て 709px に置く。
       * タブレットの縦持ち（iPad 768px なら canvas 768x345）は十分遊べるので
       * 締め出さないよう、orientation ではなく幅で判定する。
       * この規則は上書きのため必ず他の touch-mode 規則より後に置く。
       */
      #rotate-hint {
        display: none;
      }

      @media (orientation: portrait) and (max-width: 709px) {
        body.touch-mode #touch-controls,
        body.touch-mode #sys-buttons {
          display: none;
        }

        body.touch-mode #rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 22px;
          padding: 24px;
          text-align: center;
          background: var(--bg);
          color: var(--text);
          font: 400 16px/1.6 system-ui, sans-serif;
        }
      }

      #rotate-hint .icon {
        width: 84px;
        height: 84px;
        color: var(--p1);
        animation: tilt 2.4s ease-in-out infinite;
      }

      #rotate-hint .lead {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }

      #rotate-hint .sub {
        margin: 0;
        color: var(--dim);
        font-size: 14px;
      }

      /*
       * 日本語は文節の途中で折り返すと読みにくい（「収ま／りません」など）。
       * 文節を inline-block でくくり、その境界でしか改行させない。
       * word-break: auto-phrase は同じことを自動でやるが Chromium 系のみなので、
       * 併記しつつ単体では頼らない。
       */
      #rotate-hint p {
        word-break: auto-phrase;
      }

      #rotate-hint .np {
        display: inline-block;
      }

      @keyframes tilt {
        0%,
        40% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }

      /* 動きに敏感な人向け。回転アニメは情報の本体ではないので止めてよい。 */
      @media (prefers-reduced-motion: reduce) {
        #rotate-hint .icon {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- タイトル画面ではゲーム画面のどこを触ってもスタートできる。
           小さな START を狙わせない。プレイ中の Enter は無視されるので害はない。 -->
      <div id="stage-area" data-btn="key-Enter">
        <canvas id="game"></canvas>
        <!-- data-native が要る。これが無いと TouchInput が触れてしまい、
             #stage-area の key-Enter が発火して押した瞬間に次ステージへ進む。 -->
        <button id="share-button" data-native type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .13.87l-6.3 3.68A3 3 0 1 0 8.83 13l6.3 3.68A3 3 0 1 0 16 15.5l-6.3-3.68a3 3 0 0 0 0-1.64L16 6.5A3 3 0 0 0 18 8Z"
            />
          </svg>
          クリアをシェア
        </button>
      </div>

      <div id="touch-controls">
        <div class="pad pad-p1">
          <button data-btn="p0-left" aria-label="P1 左">◀</button>
          <button class="jump" data-btn="p0-jump" aria-label="P1 ジャンプ">▲</button>
          <button data-btn="p0-right" aria-label="P1 右">▶</button>
        </div>

        <div class="pad pad-p2">
          <button data-btn="p1-left" aria-label="P2 左">◀</button>
          <button class="jump" data-btn="p1-jump" aria-label="P2 ジャンプ">▲</button>
          <button data-btn="p1-right" aria-label="P2 右">▶</button>
        </div>
      </div>

      <!-- 縦画面のみ表示。CSS だけで切り替わるので JS は関与しない。 -->
      <div id="rotate-hint">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect
            x="7"
            y="2"
            width="10"
            height="20"
            rx="2.5"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <line
            x1="10.5"
            y1="19"
            x2="13.5"
            y2="19"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <p class="lead"><span class="np">横向きにしてください</span></p>
        <p class="sub">
          <span class="np">ステージが</span><span class="np">横長のため、</span><span class="np">縦画面では</span><span class="np">2人ぶんの</span><span class="np">操作ボタンが</span><span class="np">収まりません。</span><br />
          <span class="np">端末の</span><span class="np">画面回転ロックが</span><span class="np">かかっている場合は</span><span class="np">解除してください。</span>
        </p>
      </div>

      <!-- data-native: TouchInput に preventDefault させない。
           preventDefault するとタップでリンクが開かなくなる。 -->
      <div id="links" data-native>
        <a
          href="https://github.com/rokkish/claude-park"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub リポジトリ"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
            />
          </svg>
        </a>
        <a
          href="https://x.com/rokiroki_riko"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="X (@rokiroki_riko)"
          title="X"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"
            />
          </svg>
        </a>
      </div>

      <div id="sys-buttons">
        <!-- data-native: TouchInput に preventDefault させない。
             全画面要求はユーザー操作起点でないとブラウザに拒否される。 -->
        <button id="btn-fullscreen" data-native aria-label="全画面表示" hidden>⛶</button>
        <button data-btn="key-KeyR" aria-label="やり直し">R</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
